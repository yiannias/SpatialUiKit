[package]
name = "spatial-ui-kit"
version = "0.1.0"
edition = "2021"
description = "Shared egui UI chrome mechanics for SpatialSketchPad and SpatialDrawingBoard — generic over each app's own action/context types. Never depends on either app's domain crates."

[dependencies]
egui = "0.35"
serde = { version = "1", features = ["derive"] }
# Exact pin, not a caret range: `dock.rs`'s `detect_tab_drag` workaround was
# reverse-engineered against 0.20.1's specific internal drag-response
# handling (see dock.rs's module doc). An incidental minor bump could
# silently change or fix that behavior out from under the workaround.
egui_dock = { version = "=0.20.1", features = ["serde"] }
